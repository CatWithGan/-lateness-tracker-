name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        pip install --upgrade pip setuptools
        pip install "cython<3" git+https://github.com/kivy/buildozer.git

    - name: Configure and Build APK
      run: |
        # Полностью очищаем кэш buildozer перед новой сборкой
        rm -rf "$HOME/.buildozer"
        buildozer android clean

        # Добавляем флаг линковщика, чтобы компилятор точно нашел библиотеки Python
        export LDFLAGS="-L$HOME/.buildozer/android/platform/python-for-android/pythonforandroid/dist/lateness_tracker/libs"
        
        # Запускаем финальную сборку APK
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LatenessTracker_APK
        path: bin/*.apk
