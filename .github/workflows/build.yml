name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev
        pip install --upgrade pip
        # Устанавливаем Cython и Buildozer напрямую с GitHub ветки master, где исправлен баг с pip
        pip install "cython<3" git+https://github.com/kivy/buildozer.git

    - name: Build APK with Buildozer
      run: |
        # Очищаем кэш дистрибутива, чтобы избежать конфликтов NDK/SDK
        buildozer android clean
        # Запускаем финальную сборку
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LatenessTracker_APK
        path: bin/*.apk
