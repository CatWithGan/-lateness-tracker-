name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем стабильную Ubuntu

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        # Установка системных инструментов, включая 'aapt'
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev aapt
        
        # Обновление pip и установка Cython, setuptools
        pip install --upgrade pip
        pip install "setuptools<70" "cython<3" 
        
        # Установка Buildozer и python-for-android напрямую с GitHub
        pip install git+https://github.com/kivy/buildozer.git
        pip install git+https://github.com/kivy/python-for-android.git

    - name: Build APK with Buildozer
      run: |
        # *** АГРЕССИВНАЯ ОЧИСТКА КЭША BUILDER'а ***
        # Удаляем всю папку с кешем Buildozer, чтобы заставить его скачать SDK/NDK заново
        rm -rf "$HOME/.buildozer"
        # Очищаем старые артефакты сборки, чтобы избежать конфликтов
        buildozer android clean
        
        # Запускаем финальную сборку APK
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LatenessTracker_APK
        path: bin/*.apk
